# /etc/nginx/sites-available/jszhff.cn (Production Pilot: jszhff.cn)
# ------------------------------------------------------------------------------
# Precisely matched to origin server `zhaohui` (Ubuntu 24.04.4, nginx/1.24.0):
# - Static decoupling: serves directly from /var/www/jszhff.cn/current (symlink to releases/<ts>).
#   Stopping Gunicorn or event_forwarder NEVER affects public website availability (HTTP 200).
# - Preserves ALL existing TLS certs, Certbot webroot renewal, legacy 301 redirects, and cache headers.
# - Adds ONLY:
#   1) Structured metrics access_log (/var/log/nginx/jszhff.cn.metrics.log zhaohui_metrics)
#   2) /_track/event proxy to local loopback HMAC signing forwarder (127.0.0.1:18081)
# - Leaves /etc/nginx/sites-enabled/wuxifangfu and /etc/nginx/sites-enabled/zhaohuifangfu.com
#   COMPLETELY UNTOUCHED.
# ------------------------------------------------------------------------------

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name jszhff.cn;

    root /var/www/jszhff.cn/current;
    index index.html;
    charset utf-8;

    # Dedicated privacy-preserving metrics log (in addition to default /var/log/nginx/access.log)
    access_log /var/log/nginx/access.log;
    access_log /var/log/nginx/jszhff.cn.metrics.log zhaohui_metrics;

    ssl_certificate /etc/letsencrypt/live/jszhff.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jszhff.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Anonymous telemetry ingest proxy -> local HMAC signing forwarder (127.0.0.1:18081)
    # Forwarder signs payload with GatewayCredential and posts to Django (127.0.0.1:18000).
    # Hard-binds X-Matched-Domain to $server_name so browser cannot spoof site/domain attribution.
    location = /_track/event {
        limit_except POST {
            deny all;
        }
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:18081/_track/event;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Content-Type "application/json";
        proxy_set_header X-Matched-Domain $server_name;
        proxy_connect_timeout 1s;
        proxy_send_timeout 2s;
        proxy_read_timeout 2s;
        # Never block or fail visitor pages if backend is restarting
        proxy_intercept_errors on;
        error_page 502 503 504 =202 /_track/fallback;
    }

    location = /_track/fallback {
        internal;
        default_type application/json;
        return 202 '{"status":"queued_backend_unavailable"}';
    }

    location = /products {
        return 301 https://jszhff.cn/#equipment;
    }

    location = /products/ {
        return 301 https://jszhff.cn/#equipment;
    }

    location ~ ^/prototype/(tanks|reactors|towers|piping)/?$ {
        return 301 https://jszhff.cn/products/$1/;
    }

    location ~ ^/prototype/?$ {
        return 301 https://jszhff.cn/;
    }

    location ^~ /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location ^~ /images/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location ~* ^/(favicon\.ico|icon\.svg|apple-icon\.png)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location ~* ^/(robots\.txt|sitemap\.xml)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.jszhff.cn;

    ssl_certificate /etc/letsencrypt/live/jszhff.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jszhff.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://jszhff.cn$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name jszhff.cn www.jszhff.cn;

    root /var/www/jszhff.cn/current;

    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        return 301 https://jszhff.cn$request_uri;
    }
}

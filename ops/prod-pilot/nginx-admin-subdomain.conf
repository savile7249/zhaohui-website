# /etc/nginx/sites-available/admin.wuxifangfu.cn (Independent Admin Subdomain)
# ------------------------------------------------------------------------------
# Replace `admin.wuxifangfu.cn` below if you choose a different admin subdomain,
# and update DJANGO_ALLOWED_HOSTS + DJANGO_CSRF_TRUSTED_ORIGINS in /etc/zhaohui-admin/admin.env.
#
# Access policy (Decision #2):
# - Independent HTTPS subdomain (Let's Encrypt via Certbot)
# - Username + strong password login only (Django session auth)
# - NO CAPTCHA, NO client-cert mTLS (ssl_verify_client off), NO hard IP whitelist blocking
# - Public /api/ingest/* is explicitly blocked (403); ingest is strictly loopback-only on 127.0.0.1:18000.
# - Completely isolated from legacy /etc/nginx/sites-available/wuxifangfu.
# ------------------------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name admin.wuxifangfu.cn;

    root /var/www/certbot;

    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        return 301 https://admin.wuxifangfu.cn$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.wuxifangfu.cn;

    charset utf-8;
    client_max_body_size 4m;

    access_log /var/log/nginx/admin.wuxifangfu.cn.access.log;
    error_log /var/log/nginx/admin.wuxifangfu.cn.error.log;

    ssl_certificate /etc/letsencrypt/live/admin.wuxifangfu.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.wuxifangfu.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Never expose internal gateway ingest endpoints on the public admin domain
    location ^~ /api/ingest/ {
        return 403;
    }

    # Serve Django collectstatic assets directly via Nginx
    location ^~ /static/ {
        alias /var/lib/zhaohui-admin/django-static/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location / {
        proxy_pass http://127.0.0.1:18000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

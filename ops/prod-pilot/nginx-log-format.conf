# /etc/nginx/conf.d/zhaohui-metrics-log-format.conf
# Structured privacy-preserving Nginx access log format for per-domain metrics aggregation.
# Intentionally excludes client IP ($remote_addr), User-Agent, Referer, and query string ($args).
# Covered automatically by existing /etc/logrotate.d/nginx (/var/log/nginx/*.log, daily, rotate 14).

log_format zhaohui_metrics escape=json
    '{"msec":"$msec","host":"$host","server_name":"$server_name",'
    '"method":"$request_method","uri":"$uri","status":$status,'
    '"request_time":$request_time}';
